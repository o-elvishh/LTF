    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

    h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; }

    button:disabled { background: #95a5a6; cursor: not-allowed; }
    .label-bp { display: block; margin-top: 15px; font-weight: bold; }
    .mensaje-error { background: #fdecea; border: 1px solid #e74c3c; color: #922b21; padding: 14px; border-radius: 6px; margin-top: 16px; display: none; }

        <input type="text" name="nombre" placeholder="Nombre completo" required>
        <input type="email" name="correo" placeholder="Correo electrónico" required>

        { titulo: "Niveles de bioseguridad y agentes de riesgo", opciones: "A) NBS-1, B) NBS-2, C) NBS-3, D) NBS-4, E) No corresponde", preguntas: [

          "Los desechos biológicos deben ser descontaminados antes de su recolección:",

        { titulo: "Mantenimiento y limpieza", opciones: "A) Microscopio, B) Incubadora, C) Balanza granataria, D) Autoclave, E) Medidor de pH", preguntas: [

          "¿Qué equipo necesita que se limpie el electrodo después de cada medición?",
          "¿Qué equipo debe calibrarse periódicamente para garantizar mediciones precisas de pH?",
          "¿En qué equipo se deben limpiar los elementos ópticos externos para remover polvo?"
        ]},
        { titulo: "Seguridad y recomendaciones de uso", opciones: "A) Autoclave, B) Centrífuga, C) Campana de flujo laminar, D) Baño María, E) Agitador Vortex", preguntas: [
          "¿Qué equipo requiere el uso de guantes de protección térmica al retirar material?",
          "¿En qué equipo es necesario equilibrar correctamente los tubos antes de activarlo?",
          "¿En qué equipo se debe verificar que la puerta esté bien sellada antes de esterilizar?"

      ]
    };

    function crearSelect(nombre) {
      return '<select name="' + nombre + '" required>' +
        '<option value="">Seleccione...</option>' +
        '<option value="A">A</option><option value="B">B</option><option value="C">C</option>' +
        '<option value="D">D</option><option value="E">E</option>' +
        '</select>';
    }

    function renderizarExamen() {
      const contenedor = document.getElementById("pasosPreguntas");
      let numeroPregunta = 1;
      let html = "";

      EXAMENES[VERSION].forEach((seccion, index) => {
        const paso = index + 1;
        const siguiente = paso + 1;
        html += '<div class="step" id="step' + paso + '">' +
          '<h2>' + seccion.titulo + '</h2>' +
          '<div class="opciones-header">' + seccion.opciones + '</div>';

        seccion.preguntas.forEach((pregunta) => {
          html += '<div class="pregunta-caja"><p>' + numeroPregunta + ". " + pregunta + "</p>" +
            crearSelect("p" + numeroPregunta) + "</div>";
          numeroPregunta++;
        });

        html += '<button type="button" onclick="cambiarPaso(' + paso + ', ' + siguiente + ')">' +
          (index === EXAMENES[VERSION].length - 1 ? "Siguiente Sección (Abiertas)" : "Siguiente Sección") +
          "</button></div>";
      });

      html += '<div class="step" id="step9">' +
        "<h2>Buenas prácticas en el laboratorio</h2>" +
        "<p>Mencione 4 buenas prácticas para el trabajo en el laboratorio de TFD y cultivo celular:</p>" +
        '<div class="pregunta-caja">' +
        '<span class="label-bp">33.</span> <input type="text" name="bp1" required placeholder="Buena práctica 1...">' +
        '<span class="label-bp">34.</span> <input type="text" name="bp2" required placeholder="Buena práctica 2...">' +
        '<span class="label-bp">35.</span> <input type="text" name="bp3" required placeholder="Buena práctica 3...">' +
        '<span class="label-bp">36.</span> <input type="text" name="bp4" required placeholder="Buena práctica 4...">' +
        "</div>" +
        '<button type="button" id="btnEnviar" onclick="enviarExamen()">Finalizar y Enviar Examen ' + VERSION + "</button>" +
        '<div class="mensaje-error" id="mensajeError"></div>' +
        "</div>";

      contenedor.innerHTML = html;
    }

    function cambiarPaso(actual, siguiente) {
      const inputs = document.querySelectorAll("#step" + actual + " select, #step" + actual + " input");

      for (const input of inputs) {
        if (!input.checkValidity()) {
          input.reportValidity();
          return;
        }
      }

      document.getElementById("step" + actual).classList.remove("active");
      document.getElementById("step" + siguiente).classList.add("active");
      window.scrollTo(0, 0);
      history.pushState(null, "", location.href);
    }

    function enviarExamen() {
      const btn = document.getElementById("btnEnviar");
      const form = document.getElementById("examenForm");
      const errorBox = document.getElementById("mensajeError");
      const inputsFinales = document.querySelectorAll("#step9 input");

      errorBox.style.display = "none";

      for (const input of inputsFinales) {
        if (!input.checkValidity()) {
          input.reportValidity();
          return;
        }
      }

      btn.disabled = true;
      btn.innerText = "Enviando...";

      const data = Object.fromEntries(new FormData(form).entries());

      google.script.run
        .withSuccessHandler((resultado) => {
          if (resultado && resultado.ok) {
            document.querySelector(".card").innerHTML =
              "<h2>¡Enviado!</h2><p>Tus respuestas del Examen han sido registradas.</p>";
            return;
          }

          mostrarError(resultado && resultado.error ? resultado.error : "No se pudo registrar el examen.");
        })
        .withFailureHandler((error) => {
          mostrarError(error && error.message ? error.message : "No se pudo conectar con Apps Script.");
        })
        .procesarExamen(data);
    }

    function mostrarError(mensaje) {
      const btn = document.getElementById("btnEnviar");
      const errorBox = document.getElementById("mensajeError");
      errorBox.textContent = "No se pudo registrar el examen: " + mensaje;
      errorBox.style.display = "block";
      btn.disabled = false;
      btn.innerText = "Reintentar";
    }

    window.onpopstate = function() { history.go(1); };
    renderizarExamen();
  </script>
</body>
</html>
